<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stadt Land Kündigungsgrund</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Stadt Land Kündigungsgrund</h1>
    <p class="subtitle">Das lustige Multiplayer-Spiel mit unerwarteten Kategorien</p>

    <div class="join-section">
      <input
        type="text"
        id="playerName"
        placeholder="Spielername eingeben"
        maxlength="20"
        autocomplete="off"
      />
      <button id="joinBtn">Spielen</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
