<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stadt Land Kündigungsgrund</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Stadt Land Kündigungsgrund</h1>
    <p class="subtitle">Das lustige Multiplayer-Spiel mit unerwarteten Kategorien</p>

    <!-- View: Start -->
    <div id="view-start" class="view">
      <div class="form-group">
        <input
          type="text"
          id="playerName"
          placeholder="Dein Name"
          maxlength="20"
          autocomplete="off"
        />
      </div>
      <div class="btn-row">
        <button id="createRoomBtn">Raum erstellen</button>
        <button id="showJoinBtn" class="btn-secondary">Raum beitreten</button>
      </div>
      <div id="startError" class="error-msg"></div>
    </div>

    <!-- View: Join Room -->
    <div id="view-join" class="view hidden">
      <div class="form-group">
        <input
          type="text"
          id="joinPlayerName"
          placeholder="Dein Name"
          maxlength="20"
          autocomplete="off"
        />
      </div>
      <div class="form-group">
        <input
          type="text"
          id="roomCodeInput"
          placeholder="Raum-Code (z.B. TIGER7)"
          maxlength="6"
          autocomplete="off"
          class="code-input"
        />
      </div>
      <div class="btn-row">
        <button id="joinRoomBtn">Beitreten</button>
        <button id="backToStartBtn" class="btn-secondary">Zurück</button>
      </div>
      <div id="joinError" class="error-msg"></div>
    </div>

    <!-- View: Lobby -->
    <div id="view-lobby" class="view hidden">
      <div class="room-code-display">
        <span class="room-code-label">Raum-Code</span>
        <span id="displayRoomCode" class="room-code"></span>
        <span class="room-code-hint">Teile diesen Code mit deinen Mitspielern</span>
      </div>
      <div class="player-list-section">
        <h2>Spieler</h2>
        <ul id="playerList" class="player-list"></ul>
      </div>
      <div id="hostControls" class="hidden">
        <button id="startGameBtn" disabled>Spiel starten</button>
        <p id="startHint" class="start-hint">Mindestens 2 Spieler erforderlich</p>
      </div>
      <div id="waitingMsg" class="waiting-msg hidden">Warte auf den Host…</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
